name: Release

# Tag-driven publish: push a `v*.*.*` tag → build, verify, publish with provenance.
# Manual `npm publish` is blocked by package.json prepublishOnly.
#
# FIRST PUBLISH IS MANUAL (bootstrap): npm Trusted Publishing cannot create a new
# package, so 0.1.0 is published by hand without --provenance, then a Trusted
# Publisher is attached on npmjs.com. See docs/PUBLISHING.md. From 0.2.0 on, this
# workflow owns every publish.
#
# Auth (pick ONE — see docs/PUBLISHING.md):
#
#   A) npm Trusted Publishing (OIDC, preferred, no long-lived token)
#      - On npmjs.com configure this repo + workflow as trusted publisher
#      - Leave NPM_TOKEN unset (or delete the secret)
#      - Requires id-token: write + npm >= 11.5.1
#      - Do NOT leave an empty NODE_AUTH_TOKEN / _authToken= in .npmrc
#        (that blocks OIDC — see actions/setup-node#1551)
#
#   B) Classic Automation token in secrets.NPM_TOKEN
#      - Must be Classic → Automation (bypasses 2FA)
#      - Granular / Publish tokens that require OTP will fail with EOTP

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without leading v)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7

      # No registry-url here: setup-node would write
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and an empty token silently breaks OIDC trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      # Trusted publishing requires npm >= 11.5.1 (and Node >= 22.14).
      - name: Ensure npm supports OIDC trusted publishing
        run: |
          npm install -g npm@latest
          node -v
          npm -v

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package.json version matches tag
        run: |
          TAG="${{ steps.ver.outputs.version }}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag version:    $TAG"
          echo "package.json:   $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "✖ version drift: tag '$TAG' != package.json '$PKG'"
            echo "Fix: npm version $TAG -m 'release: %s' && git push origin main --follow-tags"
            exit 1
          fi
          echo "✓ versions in sync"

      # Duplicate-tag / rerun guard: if this exact version is already on npm,
      # skip publish (green, with a notice) instead of dying with E409
      # "Cannot publish over previously staged version".
      # Best-effort only: two truly concurrent runs can both pass this check;
      # npm still rejects the loser with E409.
      - name: Check if version is already on npm
        id: pubcheck
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION="${{ steps.ver.outputs.version }}"
          if [ "$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)" = "${VERSION}" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME}@${VERSION} is already on npm — skipping publish (duplicate tag push or rerun of a successful release)."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} is not on npm yet — publishing."
          fi

      # Auth mode:
      #   - If secrets.NPM_TOKEN is non-empty → classic token auth
      #   - Else → OIDC trusted publishing (no .npmrc _authToken line)
      # Never export an empty NODE_AUTH_TOKEN — that breaks OIDC.
      - name: Publish to npm (with provenance)
        if: steps.pubcheck.outputs.already != 'true'
        env:
          NPM_TOKEN_SECRET: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${NPM_TOKEN_SECRET:-}" ]; then
            echo "Auth mode: NPM_TOKEN (Classic Automation expected; OTP-bound tokens fail with EOTP)"
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN_SECRET}" > "${RUNNER_TEMP}/.npmrc"
            export NPM_CONFIG_USERCONFIG="${RUNNER_TEMP}/.npmrc"
          else
            echo "Auth mode: OIDC trusted publishing (no NPM_TOKEN secret)"
            echo "Ensure npmjs.com → package → Trusted Publisher lists:"
            echo "  repository: pungggi/pi-harness-model-proposer"
            echo "  workflow:   release.yml"
            # Make sure no empty token leaks into the environment.
            unset NODE_AUTH_TOKEN || true
            unset NPM_TOKEN || true
          fi

          npm publish --access public --provenance
